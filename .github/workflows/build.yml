name: Build Project

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - name: Build Backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Docker Image
        run: |
          docker build -t imamanwar11/saas-dashboard-backend:latest ./backend

      - name: Push Backend Docker Image
        run: |
          docker push imamanwar11/saas-dashboard-backend:latest

      - name: Build Frontend Docker Image
        run: |
          docker build -t imamanwar11/saas-dashboard-frontend:latest ./frontend

      - name: Push Frontend Docker Image
        run: |
          docker push imamanwar11/saas-dashboard-frontend:latest